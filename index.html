<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#120b1e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.json" />
  <title>PTBC A01 · Gengar</title>
  <style>
    :root {
      --bg: #120b1e;
      --panel: rgba(29, 18, 48, 0.86);
      --border: #4c2b7a;
      --accent: #7c3aed;
      --accent-glow: #e879f9;
      --danger: #b91c1c;
      --text: #f5f3ff;
      --muted: #b8a6d9;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100vh; height: 100dvh;
      background:
        radial-gradient(circle at 18% 22%, rgba(139, 92, 246, 0.24), transparent 52%),
        radial-gradient(circle at 82% 78%, rgba(217, 70, 239, 0.18), transparent 52%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden; touch-action: none; user-select: none;
    }
    .app {
      position: relative;
      display: flex; flex-direction: column; height: 100%; width: 100%;
      padding: max(6px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
      gap: 6px;
    }
    .gengar-bg {
      position: absolute; inset: 0; pointer-events: none; z-index: 0;
      overflow: hidden;
    }
    .gengar-wallpaper {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      opacity: 0.85; transition: background-image 0.2s ease;
    }
    .gengar-vignette {
      position: absolute; inset: 0;
      background: radial-gradient(circle at center, rgba(18, 11, 30, 0.08) 0%, rgba(18, 11, 30, 0.55) 100%);
    }
    .gengar-crest {
      position: absolute; right: 12px; bottom: 8px;
      width: min(22vw, 140px); height: auto; object-fit: contain;
      opacity: 0.18; filter: drop-shadow(0 0 18px rgba(168, 85, 247, 0.55));
    }
    .gengar-emblem {
      width: 22px; height: 20px; flex-shrink: 0;
      filter: drop-shadow(0 0 6px rgba(239, 68, 68, 0.45));
    }
    .topbar, .stage { position: relative; z-index: 1; }
    .topbar {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      background: rgba(24, 14, 42, 0.52); border: 1px solid var(--border);
      border-radius: 10px; padding: 5px 8px;
      flex-shrink: 0;
    }
    body.topbar-hidden .topbar { display: none; }

    /* PWA / 隱藏工具列時的角落懸浮膠囊 */
    .floating-bar {
      display: none;
      position: fixed;
      top: max(6px, env(safe-area-inset-top));
      right: max(8px, env(safe-area-inset-right));
      z-index: 50;
      align-items: center;
      gap: 6px;
      background: rgba(29, 18, 48, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 8px;
      box-shadow: 0 4px 16px rgba(124, 58, 237, 0.3);
    }
    body.topbar-hidden .floating-bar { display: flex; }
    .ble-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #6b5b8c; display: inline-block; flex-shrink: 0;
      box-shadow: 0 0 0 2px rgba(107, 91, 140, 0.25);
    }
    .ble-dot.ok {
      background: #4ade80;
      box-shadow: 0 0 8px rgba(74, 222, 128, 0.65);
    }
    .ble-dot.busy { background: #facc15; }
    .float-btn {
      border: 1px solid var(--border); background: #2b1a47; color: var(--text);
      border-radius: 999px; padding: 4px 9px; font-size: 12px; font-weight: 700;
      cursor: pointer; line-height: 1.2;
    }

    .btn-sm {
      padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border);
      background: #2b1a47; color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn-sm.primary { background: linear-gradient(135deg, #7c3aed, #a21caf); border-color: var(--accent-glow); }
    .btn-sm.danger { background: var(--danger); border-color: #f87171; }
    .pill {
      font-family: monospace; font-size: 12px; padding: 4px 8px;
      border-radius: 6px; background: #130b21; border: 1px solid var(--border); color: var(--muted);
    }
    .pill.ok { color: #4ade80; border-color: #166534; }
    .spacer { flex: 1; }

    /* 主操控區 */
    .stage { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; min-height: 0; }
    .pad-box {
      position: relative;
      background: rgba(18, 11, 30, 0.14);
      border: 1px solid rgba(192, 132, 252, 0.35); border-radius: 12px;
      padding: 8px; display: flex; flex-direction: column; gap: 6px; min-height: 0;
      box-shadow: 0 6px 24px rgba(10, 4, 20, 0.35), inset 0 1px 0 rgba(216, 180, 254, 0.12);
    }
    .pad-box::before, .pad-box::after {
      content: ""; position: absolute; width: 14px; height: 14px; pointer-events: none;
      border-color: var(--accent-glow); border-style: solid; opacity: 0.55;
    }
    .pad-box::before { top: 4px; left: 4px; border-width: 2px 0 0 2px; border-radius: 6px 0 0 0; }
    .pad-box::after { bottom: 4px; right: 4px; border-width: 0 2px 2px 0; border-radius: 0 0 6px 0; }
    .panel-bar {
      display: flex; align-items: center; gap: 5px; flex-wrap: wrap; flex-shrink: 0;
    }
    .panel-title { font-size: 11px; color: var(--muted); font-weight: 600; margin-right: 2px; }
    .seg-btn {
      flex: 1; min-width: 44px; padding: 6px 6px; border-radius: 7px;
      border: 1px solid var(--border); background: rgba(39, 24, 64, 0.42); color: var(--muted);
      font-size: 12px; font-weight: 700; cursor: pointer; text-align: center;
      text-shadow: 0 1px 3px #000;
    }
    .seg-btn.on { background: linear-gradient(135deg, #7c3aed, #9333ea); border-color: var(--accent-glow); color: #fff; box-shadow: 0 0 10px rgba(168, 85, 247, 0.35); }
    .seg-btn.nudge-on { background: #a21caf; border-color: #f472b6; color: #fff; box-shadow: 0 0 10px rgba(244, 114, 182, 0.35); }
    .pad-grid { flex: 1; display: grid; gap: 8px; min-height: 0; }
    .dpad {
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
    }
    .auxpad {
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
    }
    .auxpad.m3-only {
      grid-template-columns: 1fr;
      grid-template-rows: repeat(2, 1fr);
    }
    .auxpad.m3-plus-only {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
    }
    .rawpad {
      display: grid; gap: 8px; min-height: 0;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(2, 1fr);
      grid-column: 1 / -1;
    }
    .pad-btn {
      border-radius: 12px; border: 1.5px solid rgba(192, 132, 252, 0.52);
      background: rgba(24, 12, 44, 0.26);
      color: var(--text);
      font-size: clamp(14px, 2.5vw, 19px); font-weight: 700; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      min-height: 0; padding: 4px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.95), 0 0 8px rgba(18, 11, 30, 0.9);
      box-shadow: inset 0 1px 0 rgba(216, 180, 254, 0.18);
      transition: transform 0.04s, background 0.04s, box-shadow 0.04s;
    }
    .auxpad.m3-only .pad-btn,
    .auxpad.m3-plus-only .pad-btn {
      font-size: clamp(18px, 3.2vw, 26px);
      gap: 6px;
    }
    .pad-btn small { font-size: 11px; color: #e9d5ff; font-family: monospace; font-weight: 500; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95); }
    .pad-btn.active {
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.62), rgba(192, 38, 211, 0.62));
      border-color: var(--accent-glow);
      box-shadow: 0 0 18px rgba(232, 121, 249, 0.65);
      transform: scale(0.97);
    }
    .pad-btn.stop-center {
      background: rgba(92, 16, 36, 0.42);
      border-color: rgba(239, 68, 68, 0.85);
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.35), inset 0 0 14px rgba(239, 68, 68, 0.3);
      font-size: clamp(13px, 2.2vw, 16px);
    }
    .empty { pointer-events: none; opacity: 0; }

    /* 手機橫向緊湊微調 */
    @media (orientation: landscape) and (max-height: 460px) {
      .app { gap: 5px; }
      .stage { gap: 6px; }
      .pad-box { padding: 6px; gap: 5px; border-radius: 10px; }
      .pad-grid { gap: 6px; }
      .pad-btn { border-radius: 10px; }
      .pad-btn small { font-size: 10px; }
    }

    /* 直向螢幕時自動強制橫向旋轉整個介面（免提示旋轉） */
    @media (orientation: portrait) {
      .app {
        position: fixed;
        top: 0; left: 0;
        width: 100dvh;
        height: 100vw;
        transform-origin: top left;
        transform: rotate(90deg) translateY(-100%);
      }
      dialog {
        transform: rotate(90deg);
        width: min(88dvh, 520px);
        max-height: 88vw;
      }
    }

    /* 設定抽屜 */
    dialog {
      background: var(--panel); color: var(--text); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px; width: min(94vw, 560px); max-height: 88dvh; overflow-y: auto;
    }
    dialog::backdrop { background: rgba(0,0,0,0.7); }
    .map-row { display: grid; grid-template-columns: 110px 1fr 1fr; gap: 8px; align-items: center; margin: 8px 0; }
    .m3-cfg-card {
      background: #11151d; border: 1px solid var(--border); border-radius: 10px;
      padding: 10px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px;
    }
    .m3-cfg-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: center;
    }
    .m3-cfg-grid label {
      display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted);
    }
    select, input[type="text"], input[type="number"] {
      background: #0d0f14; color: var(--text); border: 1px solid var(--border);
      padding: 6px 8px; border-radius: 6px; font-size: 13px;
    }
  </style>
</head>
<body>
<div class="app">
  <div class="gengar-bg" aria-hidden="true">
    <div class="gengar-wallpaper" id="gengarWallpaper"></div>
    <div class="gengar-vignette"></div>
    <img class="gengar-crest" id="gengarCrest" src="./gengar_bg.png" alt="" />
  </div>
  <div class="topbar">
    <svg class="gengar-emblem" viewBox="0 0 64 56" aria-hidden="true">
      <path d="M12,20 L4,4 L22,14 Q32,9 42,14 L60,4 L52,20 Q58,31 54,43 Q48,54 32,54 Q16,54 10,43 Q6,31 12,20 Z" fill="#7c3aed" stroke="#c084fc" stroke-width="2"/>
      <polygon points="15,24 28,29 18,33" fill="#ef4444"/>
      <polygon points="49,24 36,29 46,33" fill="#ef4444"/>
      <path d="M16,38 Q32,48 48,38 Q40,50 32,50 Q24,50 16,38 Z" fill="#f5f3ff"/>
    </svg>
    <button class="btn-sm primary" id="btnConn">連線 BLE</button>
    <button class="btn-sm danger" id="btnDisc" disabled>斷線</button>
    <span class="pill" id="status">未連線</span>
    <span class="pill" id="txHex">TX: 0x00</span>
    <div class="spacer"></div>
    <button class="btn-sm" id="btnMode">模式: 車體+機構</button>
    <button class="btn-sm" id="btnSettings">設定</button>
    <button class="btn-sm" id="btnFull">全螢幕</button>
    <button class="btn-sm" id="btnHideTopbar" title="隱藏工具列">▲ 收起</button>
  </div>

  <div class="floating-bar" id="floatingBar">
    <svg class="gengar-emblem" style="width:18px;height:16px;" viewBox="0 0 64 56" aria-hidden="true">
      <path d="M12,20 L4,4 L22,14 Q32,9 42,14 L60,4 L52,20 Q58,31 54,43 Q48,54 32,54 Q16,54 10,43 Q6,31 12,20 Z" fill="#7c3aed" stroke="#c084fc" stroke-width="2"/>
      <polygon points="15,24 28,29 18,33" fill="#ef4444"/>
      <polygon points="49,24 36,29 46,33" fill="#ef4444"/>
      <path d="M16,38 Q32,48 48,38 Q40,50 32,50 Q24,50 16,38 Z" fill="#f5f3ff"/>
    </svg>
    <span class="ble-dot" id="floatBleDot" title="BLE 狀態"></span>
    <button class="float-btn" id="btnFloatMenu" title="展開工具列">☰ 選單</button>
    <button class="float-btn" id="btnFloatSettings" title="設定">⚙</button>
  </div>

  <div class="stage" id="stage"></div>
</div>

<dialog id="settingsDialog">
  <h3 style="margin:0 0 10px;">控制器設定</h3>
  <div style="display:flex; flex-direction:column; gap:10px; padding-bottom:12px; border-bottom:1px solid var(--border); margin-bottom:12px;">
    <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
      <input type="checkbox" id="chkPtOnly" style="width:18px; height:18px;" />
      <span><strong>僅掃描 PT 開頭裝置</strong> — 優先過濾賽場雜訊</span>
    </label>
    <label style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
      <span><strong>背景圖樣：</strong></span>
      <select id="selBgArt">
        <option value="gengar_art1.jpg">暗影幽靈（同人插畫 1）</option>
        <option value="gengar_art2.png">紫霧紅眼（同人插畫 2）</option>
        <option value="gengar_art3.png">深淵凝視（同人插畫 3）</option>
        <option value="gengar_bg.png">經典立繪</option>
      </select>
    </label>
    <label style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
      <span><strong>右側機構按鈕：</strong></span>
      <select id="selAuxLayout">
        <option value="m3m4">M3 (A+/A-) + M4（4 顆）</option>
        <option value="m3">僅保留 M3（A+ / A- 2 顆）</option>
        <option value="m3p">僅保留 M3 A+（單顆大按鈕）</option>
      </select>
    </label>
    <label style="display:flex; align-items:center; gap:8px;">
      <span>微動脈衝時間 (ms)：</span>
      <input type="number" id="numNudgeMs" min="20" max="300" step="10" style="width:80px;" />
    </label>
  </div>

  <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px;">
    <h4 style="margin:0;">M3 機構（A+ / A-）手動設定</h4>
    <button type="button" class="btn-sm" id="btnSwapM3Bits" style="padding:4px 8px; font-size:12px;">⇄ 互換 A+ / A- Bit</button>
  </div>
  <div class="m3-cfg-card">
    <strong style="font-size:13px;">M3 正轉 (A+)</strong>
    <div class="m3-cfg-grid">
      <label>按鈕名稱
        <input type="text" id="m3pLabel" maxlength="20" placeholder="M3 正轉 (A+)" />
      </label>
      <label>Bit 腳位
        <select id="m3pBit"></select>
      </label>
      <label>觸發模式
        <select id="m3pMode">
          <option value="hold">按住動作 (Hold)</option>
          <option value="toggle">點一下鎖定 (Toggle)</option>
          <option value="pulse">定時脈衝 (Pulse)</option>
        </select>
      </label>
      <label>脈衝時間 (ms)
        <input type="number" id="m3pPulseMs" min="20" max="5000" step="10" />
      </label>
    </div>
  </div>
  <div class="m3-cfg-card">
    <strong style="font-size:13px;">M3 反轉 (A-)</strong>
    <div class="m3-cfg-grid">
      <label>按鈕名稱
        <input type="text" id="m3nLabel" maxlength="20" placeholder="M3 反轉 (A-)" />
      </label>
      <label>Bit 腳位
        <select id="m3nBit"></select>
      </label>
      <label>觸發模式
        <select id="m3nMode">
          <option value="hold">按住動作 (Hold)</option>
          <option value="toggle">點一下鎖定 (Toggle)</option>
          <option value="pulse">定時脈衝 (Pulse)</option>
        </select>
      </label>
      <label>脈衝時間 (ms)
        <input type="number" id="m3nPulseMs" min="20" max="5000" step="10" />
      </label>
    </div>
  </div>

  <h4 style="margin:12px 0 6px;">其他馬達 Bit 映射（免改程式碼調整接線）</h4>
  <p style="margin:0 0 10px; font-size:13px; color:var(--muted);">
    可先切到「8-Bit 測試」測出各 Bit 對應馬達後在此指定。設定會自動儲存。
  </p>
  <div id="mapRows"></div>
  <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:14px;">
    <button class="btn-sm" id="btnResetSettings">恢復預設</button>
    <button class="btn-sm primary" id="btnSaveSettings">儲存並關閉</button>
  </div>
</dialog>

<script>
const SVC_UUID = 0xffe0;
const CHR_UUID = 0xffe1;
const STORAGE_KEY = "ptbc_a01_keymap_v1";

// 預設映射與介面設定（自動存入 localStorage）
const DEFAULT_MAP = {
  m1p: 0x01, m1n: 0x02, // 左輪 (M1)
  m2p: 0x04, m2n: 0x08, // 右輪 (M2)
  m3p: 0x10, m3n: 0x20, // 機構 A (M3)
  m4p: 0x40, m4n: 0x80, // 機構 B (M4)
};
const DEFAULT_SETTINGS = {
  auxLayout: "m3m4", // "m3m4" | "m3" | "m3p"
  bgArt: "gengar_art1.jpg",
  nudgeMs: 60,
  ptOnly: true,
  m3p: { label: "M3 正轉 (A+)", mode: "hold", pulseMs: 250 },
  m3n: { label: "M3 反轉 (A-)", mode: "hold", pulseMs: 250 },
};

function loadSettings() {
  const raw = loadJSON("ptbc_a01_ui_v1", DEFAULT_SETTINGS);
  return {
    ...DEFAULT_SETTINGS,
    ...raw,
    m3p: { ...DEFAULT_SETTINGS.m3p, ...(raw.m3p || {}) },
    m3n: { ...DEFAULT_SETTINGS.m3n, ...(raw.m3n || {}) },
  };
}

let keyMap = loadJSON(STORAGE_KEY, DEFAULT_MAP);
let uiSettings = loadSettings();
let mode = "drive"; // "drive" | "raw"
let device = null;
let txChar = null;
let timerId = null;
let inFlight = false;
let wakeLock = null;
let driveFast = true; // true=快 (100%), false=慢 (60%, 30ms ON / 20ms OFF @ 20Hz)
let nudgeMode = false; // 微動模式: 點一下只轉設定毫秒數
let tickPhase = 0;

// 分開追蹤移動 (M1/M2) 與機構 (M3/M4)，讓移動降速時機構仍保持 100% 扭力
const activeDrive = new Map();
const activeAux = new Map();

function loadJSON(key, fallback) {
  try {
    const saved = JSON.parse(localStorage.getItem(key));
    return saved ? { ...fallback, ...saved } : { ...fallback };
  } catch {
    return { ...fallback };
  }
}

function guardPairs(m) {
  const pairs = [
    [keyMap.m1p, keyMap.m1n],
    [keyMap.m2p, keyMap.m2n],
    [keyMap.m3p, keyMap.m3n],
    [keyMap.m4p, keyMap.m4n],
  ];
  for (const [a, b] of pairs) {
    if ((m & a) && (m & b)) m &= ~(a | b);
  }
  return m & 0xff;
}

function computeMasks() {
  let d = 0;
  for (const bits of activeDrive.values()) d |= bits;
  let a = 0;
  for (const bits of activeAux.values()) a |= bits;
  const combined = guardPairs(d | a);
  return { drive: guardPairs(d) & combined, aux: guardPairs(a) & combined, combined };
}

function updateTxUI() {
  const { combined } = computeMasks();
  document.getElementById("txHex").textContent = "TX: 0x" + combined.toString(16).padStart(2, "0").toUpperCase();
}

let desiredByte = 0;
let ackedByte = -1;
let forceNextTx = false;
let confirmTimer = null;

async function pumpTx() {
  if (!txChar || inFlight) return;
  if (!forceNextTx && desiredByte === ackedByte) return;
  inFlight = true;
  const val = desiredByte;
  forceNextTx = false;
  try {
    await txChar.writeValueWithResponse(new Uint8Array([val]));
    ackedByte = val;
  } catch {
    try {
      await txChar.writeValueWithoutResponse(new Uint8Array([val]));
      ackedByte = val;
    } catch {
      ackedByte = -1; // 下次 tick 自動重送
    }
  } finally {
    inFlight = false;
    if (txChar && (forceNextTx || desiredByte !== ackedByte)) {
      pumpTx();
    }
  }
}

function sendByte(val, _fast = false, isStateChange = false) {
  desiredByte = val & 0xff;
  if (isStateChange) {
    forceNextTx = true;
    if (confirmTimer) clearTimeout(confirmTimer);
    // 35ms 後雙重確認補送一次當前狀態，防止 ZS-040 UART 偶發漏字元
    confirmTimer = setTimeout(() => {
      forceNextTx = true;
      pumpTx();
    }, 35);
  }
  pumpTx();
}

function bindHoldButton(el, id, getBits, targetMap, allowNudge = false) {
  let nudgeTimer = null;
  const release = () => {
    if (nudgeTimer) { clearTimeout(nudgeTimer); nudgeTimer = null; }
    if (!targetMap.has(id)) return;
    targetMap.delete(id);
    el.classList.remove("active");
    updateTxUI();
    sendByte(computeMasks().combined, true, true);
  };
  const down = (e) => {
    e.preventDefault();
    if (nudgeTimer) { clearTimeout(nudgeTimer); nudgeTimer = null; }
    if (e.pointerId !== undefined) {
      try { el.setPointerCapture(e.pointerId); } catch {}
    }
    targetMap.set(id, getBits());
    el.classList.add("active");
    if (navigator.vibrate) navigator.vibrate(12);
    updateTxUI();
    sendByte(computeMasks().combined, true, true);
    if (allowNudge && nudgeMode) {
      nudgeTimer = setTimeout(release, uiSettings.nudgeMs);
    }
  };
  const up = (e) => {
    e.preventDefault();
    release();
  };
  el.addEventListener("pointerdown", down);
  el.addEventListener("pointerup", up);
  el.addEventListener("pointercancel", up);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

const m3Timers = new Map();
const m3Buttons = new Map();

function clearM3Timers() {
  for (const t of m3Timers.values()) clearTimeout(t);
  m3Timers.clear();
}

function clearM3Direction(id) {
  if (m3Timers.has(id)) {
    clearTimeout(m3Timers.get(id));
    m3Timers.delete(id);
  }
  activeAux.delete(id);
  const btn = m3Buttons.get(id);
  if (btn) btn.classList.remove("active");
}

function bindM3Button(el, id, oppId, getBits, cfg) {
  const modeType = cfg.mode || "hold";
  if (modeType === "hold") {
    bindHoldButton(el, id, getBits, activeAux, false);
    return;
  }
  el.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    if (modeType === "toggle") {
      if (activeAux.has(id)) {
        clearM3Direction(id);
      } else {
        clearM3Direction(oppId);
        activeAux.set(id, getBits());
        el.classList.add("active");
      }
      if (navigator.vibrate) navigator.vibrate(12);
      updateTxUI();
      sendByte(computeMasks().combined, true, true);
      return;
    }
    if (modeType === "pulse") {
      clearM3Direction(id);
      clearM3Direction(oppId);
      activeAux.set(id, getBits());
      el.classList.add("active");
      if (navigator.vibrate) navigator.vibrate(12);
      updateTxUI();
      sendByte(computeMasks().combined, true, true);
      const ms = Math.max(20, Math.min(5000, Number(cfg.pulseMs) || 250));
      m3Timers.set(id, setTimeout(() => {
        m3Timers.delete(id);
        activeAux.delete(id);
        el.classList.remove("active");
        updateTxUI();
        sendByte(computeMasks().combined, true, true);
      }, ms));
    }
  });
}

function makeM3Btn(id, oppId, getBits, cfg, fallbackLabel) {
  const modeType = cfg.mode || "hold";
  const modeText = modeType === "toggle" ? "鎖定" : modeType === "pulse" ? `脈衝 ${Math.max(20, Math.min(5000, Number(cfg.pulseMs) || 250))}ms` : "按住";
  const tag = id === "m3p" ? "A+" : "A-";
  const label = (cfg.label || "").trim() || fallbackLabel;
  const btn = document.createElement("button");
  btn.className = "pad-btn";
  btn.innerHTML = `<span>${escapeHtml(label)}</span><small>${tag} · ${modeText}</small>`;
  m3Buttons.set(id, btn);
  bindM3Button(btn, id, oppId, getBits, cfg);
  return btn;
}

function makePadBtn(label, sub, id, getBits, targetMap, allowNudge = false, extraClass = "") {
  const btn = document.createElement("button");
  btn.className = "pad-btn " + extraClass;
  btn.innerHTML = `<span>${label}</span>${sub ? `<small>${sub}</small>` : ""}`;
  if (id) bindHoldButton(btn, id, getBits, targetMap, allowNudge);
  return btn;
}

function renderStage() {
  clearM3Timers();
  m3Buttons.clear();
  activeDrive.clear();
  activeAux.clear();
  updateTxUI();
  const stage = document.getElementById("stage");
  stage.innerHTML = "";

  if (mode === "raw") {
    const box = document.createElement("div");
    box.className = "pad-box rawpad";
    for (let i = 0; i < 8; i++) {
      const bit = 1 << i;
      const hex = "0x" + bit.toString(16).padStart(2, "0").toUpperCase();
      box.appendChild(makePadBtn(`Bit ${i}`, hex, `raw_${i}`, () => bit, activeAux));
    }
    stage.appendChild(box);
    return;
  }

  // 左側：移動速度條 + 微動切換 + 3x3 D-Pad
  const left = document.createElement("div");
  left.className = "pad-box";

  const speedBar = document.createElement("div");
  speedBar.className = "panel-bar";
  speedBar.innerHTML = `<span class="panel-title">移動速度</span>`;
  [
    { fast: true, label: "快 100%" },
    { fast: false, label: "慢 60%" },
  ].forEach(({ fast, label }) => {
    const b = document.createElement("button");
    b.className = "seg-btn" + (driveFast === fast ? " on" : "");
    b.textContent = label;
    b.dataset.fast = String(fast);
    b.onclick = () => {
      driveFast = fast;
      speedBar.querySelectorAll("[data-fast]").forEach((x) => x.classList.toggle("on", x.dataset.fast === String(fast)));
    };
    speedBar.appendChild(b);
  });

  const btnNudge = document.createElement("button");
  btnNudge.className = "seg-btn" + (nudgeMode ? " nudge-on" : "");
  btnNudge.textContent = `微動 ${uiSettings.nudgeMs}ms`;
  btnNudge.onclick = () => {
    nudgeMode = !nudgeMode;
    btnNudge.classList.toggle("nudge-on", nudgeMode);
  };
  speedBar.appendChild(btnNudge);

  const dpadGrid = document.createElement("div");
  dpadGrid.className = "pad-grid dpad";
  const dpadLayout = [
    ["↖ 左前", "M2+", "fl", () => keyMap.m2p],
    ["▲ 前進", "M1+ M2+", "fwd", () => keyMap.m1p | keyMap.m2p],
    ["↗ 右前", "M1+", "fr", () => keyMap.m1p],
    ["◀ 原地左轉", "M1- M2+", "tl", () => keyMap.m1n | keyMap.m2p],
    ["■ 急停", "0x00", "stop", () => 0, "stop-center"],
    ["▶ 原地右轉", "M1+ M2-", "tr", () => keyMap.m1p | keyMap.m2n],
    ["↙ 左後", "M2-", "bl", () => keyMap.m2n],
    ["▼ 後退", "M1- M2-", "rev", () => keyMap.m1n | keyMap.m2n],
    ["↘ 右後", "M1-", "br", () => keyMap.m1n],
  ];
  dpadLayout.forEach(([label, sub, id, fn, cls]) => {
    if (id === "stop") {
      const b = makePadBtn(label, sub, null, null, null, false, cls || "");
      b.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        clearM3Timers();
        activeDrive.clear();
        activeAux.clear();
        document.querySelectorAll(".pad-btn.active").forEach((el) => el.classList.remove("active"));
        updateTxUI();
        sendByte(0, true, true);
      });
      dpadGrid.appendChild(b);
      return;
    }
    dpadGrid.appendChild(makePadBtn(label, sub, id, fn, activeDrive, true, cls || ""));
  });
  left.appendChild(speedBar);
  left.appendChild(dpadGrid);

  // 右側：機構馬達（依設定顯示 M3+M4 或僅保留 M3）
  const right = document.createElement("div");
  right.className = "pad-box";
  right.innerHTML = `<div class="panel-bar"><span class="panel-title">機構馬達（恆定 100% 扭力）</span></div>`;
  const auxLayout = uiSettings.auxLayout || (uiSettings.m3Only ? "m3" : "m3m4");
  const auxGrid = document.createElement("div");
  auxGrid.className = "pad-grid auxpad" + (auxLayout === "m3" ? " m3-only" : auxLayout === "m3p" ? " m3-plus-only" : "");
  auxGrid.appendChild(makeM3Btn("m3p", "m3n", () => keyMap.m3p, uiSettings.m3p, "M3 正轉 (A+)"));
  if (auxLayout === "m3m4") {
    auxGrid.appendChild(makePadBtn("M4 正轉", "機構 B+", "m4p", () => keyMap.m4p, activeAux));
  }
  if (auxLayout !== "m3p") {
    auxGrid.appendChild(makeM3Btn("m3n", "m3p", () => keyMap.m3n, uiSettings.m3n, "M3 反轉 (A-)"));
  }
  if (auxLayout === "m3m4") {
    auxGrid.appendChild(makePadBtn("M4 反轉", "機構 B-", "m4n", () => keyMap.m4n, activeAux));
  }
  right.appendChild(auxGrid);

  stage.appendChild(left);
  stage.appendChild(right);
}

// BLE 連線管理
const statusEl = document.getElementById("status");
const floatBleDot = document.getElementById("floatBleDot");
const btnConn = document.getElementById("btnConn");
const btnDisc = document.getElementById("btnDisc");

function setBleDot(state) {
  floatBleDot.classList.remove("ok", "busy");
  if (state === "ok") floatBleDot.classList.add("ok");
  else if (state === "busy") floatBleDot.classList.add("busy");
}

function cleanup() {
  if (timerId) { clearInterval(timerId); timerId = null; }
  if (confirmTimer) { clearTimeout(confirmTimer); confirmTimer = null; }
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  clearM3Timers();
  txChar = null;
  desiredByte = 0;
  ackedByte = -1;
  forceNextTx = false;
  inFlight = false;
  activeDrive.clear();
  activeAux.clear();
  updateTxUI();
  statusEl.textContent = "未連線";
  statusEl.classList.remove("ok");
  setBleDot("idle");
  btnConn.disabled = false;
  btnDisc.disabled = true;
}

btnConn.onclick = async () => {
  try {
    const reqOpts = uiSettings.ptOnly
      ? { filters: [{ namePrefix: "PT" }], optionalServices: [SVC_UUID] }
      : { acceptAllDevices: true, optionalServices: [SVC_UUID] };
    device = await navigator.bluetooth.requestDevice(reqOpts);
    device.addEventListener("gattserverdisconnected", cleanup);
    statusEl.textContent = "連線中...";
    setBleDot("busy");
    const server = await device.gatt.connect();
    const svc = await server.getPrimaryService(SVC_UUID);
    txChar = await svc.getCharacteristic(CHR_UUID);
    await txChar.startNotifications().catch(() => {});

    if (navigator.wakeLock) {
      wakeLock = await navigator.wakeLock.request("screen").catch(() => null);
    }

    statusEl.textContent = device.name || "已連線";
    statusEl.classList.add("ok");
    setBleDot("ok");
    btnConn.disabled = true;
    btnDisc.disabled = false;
    tickPhase = 0;
    desiredByte = 0;
    ackedByte = -1;
    let hbCount = 0;
    timerId = setInterval(() => {
      const { drive, aux, combined } = computeMasks();
      if (drive === 0 || driveFast) {
        desiredByte = combined;
        hbCount = (hbCount + 1) % 10;
        if (hbCount === 1) forceNextTx = true; // 100ms 強制心跳
        pumpTx();
      } else {
        // 慢速 60% @ 20Hz (30ms ON / 20ms OFF)，只有真的送出成功 ackedByte 才會更新，絕不漏包
        desiredByte = (tickPhase < 3 ? drive : 0) | aux;
        pumpTx();
        tickPhase = (tickPhase + 1) % 5;
      }
    }, 10);
  } catch (err) {
    statusEl.textContent = "連線失敗";
    cleanup();
  }
};

btnDisc.onclick = () => {
  if (device && device.gatt.connected) device.gatt.disconnect();
  cleanup();
};

// PWA / 工具列顯示切換
function isPWAMode() {
  return (
    window.matchMedia("(display-mode: fullscreen)").matches ||
    window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true
  );
}
let topbarHidden = isPWAMode();
function setTopbarHidden(hidden) {
  topbarHidden = hidden;
  document.body.classList.toggle("topbar-hidden", topbarHidden);
}
setTopbarHidden(topbarHidden);

document.getElementById("btnHideTopbar").onclick = () => setTopbarHidden(true);
document.getElementById("btnFloatMenu").onclick = () => setTopbarHidden(false);
["fullscreen", "standalone"].forEach((dm) => {
  window.matchMedia(`(display-mode: ${dm})`).addEventListener?.("change", (e) => {
    if (e.matches) setTopbarHidden(true);
  });
});

// 模式切換與全螢幕
const btnMode = document.getElementById("btnMode");
btnMode.onclick = () => {
  mode = mode === "drive" ? "raw" : "drive";
  btnMode.textContent = mode === "drive" ? "模式: 車體+機構" : "模式: 8-Bit 測試";
  renderStage();
};

document.getElementById("btnFull").onclick = () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  else document.exitFullscreen().catch(() => {});
};

// 控制器設定 Dialog
const settingsDialog = document.getElementById("settingsDialog");
const mapRows = document.getElementById("mapRows");
const chkPtOnly = document.getElementById("chkPtOnly");
const selBgArt = document.getElementById("selBgArt");
const selAuxLayout = document.getElementById("selAuxLayout");
const numNudgeMs = document.getElementById("numNudgeMs");
const m3pLabel = document.getElementById("m3pLabel");
const m3pBit = document.getElementById("m3pBit");
const m3pMode = document.getElementById("m3pMode");
const m3pPulseMs = document.getElementById("m3pPulseMs");
const m3nLabel = document.getElementById("m3nLabel");
const m3nBit = document.getElementById("m3nBit");
const m3nMode = document.getElementById("m3nMode");
const m3nPulseMs = document.getElementById("m3nPulseMs");

const CHANNELS = [
  ["M1 (左輪)", "m1p", "m1n"],
  ["M2 (右輪)", "m2p", "m2n"],
  ["M4 (機構B)", "m4p", "m4n"],
];

function bitOptions(selected) {
  return Array.from({ length: 8 }, (_, i) => {
    const v = 1 << i;
    const hex = "0x" + v.toString(16).padStart(2, "0").toUpperCase();
    return `<option value="${v}" ${v === selected ? "selected" : ""}>Bit ${i} (${hex})</option>`;
  }).join("");
}

function syncPulseInputs() {
  m3pPulseMs.disabled = m3pMode.value !== "pulse";
  m3nPulseMs.disabled = m3nMode.value !== "pulse";
}
m3pMode.onchange = syncPulseInputs;
m3nMode.onchange = syncPulseInputs;

document.getElementById("btnSwapM3Bits").onclick = () => {
  const tmp = m3pBit.value;
  m3pBit.value = m3nBit.value;
  m3nBit.value = tmp;
};

function applyBgArt() {
  const art = uiSettings.bgArt || DEFAULT_SETTINGS.bgArt;
  const wp = document.getElementById("gengarWallpaper");
  const crest = document.getElementById("gengarCrest");
  const isOfficial = art === "gengar_bg.png";
  wp.style.backgroundImage = isOfficial ? "none" : `url("./${art}")`;
  crest.style.display = isOfficial ? "block" : "none";
  crest.style.width = isOfficial ? "min(56vw, 360px)" : "";
  crest.style.right = isOfficial ? "50%" : "";
  crest.style.bottom = isOfficial ? "50%" : "";
  crest.style.transform = isOfficial ? "translate(50%, 50%)" : "";
  crest.style.opacity = isOfficial ? "0.75" : "";
}
applyBgArt();

function openSettings() {
  chkPtOnly.checked = uiSettings.ptOnly;
  selBgArt.value = uiSettings.bgArt || DEFAULT_SETTINGS.bgArt;
  selAuxLayout.value = uiSettings.auxLayout || (uiSettings.m3Only ? "m3" : "m3m4");
  numNudgeMs.value = uiSettings.nudgeMs;

  m3pLabel.value = uiSettings.m3p.label;
  m3pBit.innerHTML = bitOptions(keyMap.m3p);
  m3pMode.value = uiSettings.m3p.mode;
  m3pPulseMs.value = uiSettings.m3p.pulseMs;

  m3nLabel.value = uiSettings.m3n.label;
  m3nBit.innerHTML = bitOptions(keyMap.m3n);
  m3nMode.value = uiSettings.m3n.mode;
  m3nPulseMs.value = uiSettings.m3n.pulseMs;

  syncPulseInputs();

  mapRows.innerHTML = CHANNELS.map(([name, kp, kn]) => `
    <div class="map-row">
      <strong>${name}</strong>
      <label>正轉: <select data-key="${kp}">${bitOptions(keyMap[kp])}</select></label>
      <label>反轉: <select data-key="${kn}">${bitOptions(keyMap[kn])}</select></label>
    </div>
  `).join("");
  settingsDialog.showModal();
}

document.getElementById("btnSettings").onclick = openSettings;
document.getElementById("btnFloatSettings").onclick = openSettings;

document.getElementById("btnResetSettings").onclick = () => {
  keyMap = { ...DEFAULT_MAP };
  uiSettings = {
    ...DEFAULT_SETTINGS,
    m3p: { ...DEFAULT_SETTINGS.m3p },
    m3n: { ...DEFAULT_SETTINGS.m3n },
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(keyMap));
  localStorage.setItem("ptbc_a01_ui_v1", JSON.stringify(uiSettings));
  applyBgArt();
  settingsDialog.close();
  renderStage();
};

document.getElementById("btnSaveSettings").onclick = () => {
  uiSettings.ptOnly = chkPtOnly.checked;
  uiSettings.bgArt = selBgArt.value;
  uiSettings.auxLayout = selAuxLayout.value;
  uiSettings.nudgeMs = Math.max(20, Math.min(300, Number(numNudgeMs.value) || 60));

  uiSettings.m3p = {
    label: m3pLabel.value.trim() || DEFAULT_SETTINGS.m3p.label,
    mode: m3pMode.value,
    pulseMs: Math.max(20, Math.min(5000, Number(m3pPulseMs.value) || 250)),
  };
  uiSettings.m3n = {
    label: m3nLabel.value.trim() || DEFAULT_SETTINGS.m3n.label,
    mode: m3nMode.value,
    pulseMs: Math.max(20, Math.min(5000, Number(m3nPulseMs.value) || 250)),
  };

  keyMap.m3p = Number(m3pBit.value);
  keyMap.m3n = Number(m3nBit.value);
  mapRows.querySelectorAll("select").forEach((sel) => {
    keyMap[sel.dataset.key] = Number(sel.value);
  });

  localStorage.setItem(STORAGE_KEY, JSON.stringify(keyMap));
  localStorage.setItem("ptbc_a01_ui_v1", JSON.stringify(uiSettings));
  applyBgArt();
  settingsDialog.close();
  renderStage();
};

renderStage();
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}
</script>
